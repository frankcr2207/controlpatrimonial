<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
	
	<style type="text/css">
	 	.selected{ background-color: #E1E1E1; } tr:hover{ background-color: #E1E1E1; } 

		input{
			width: 300px;
	    	border:0;
		    border-bottom: 1px solid #009CBF;
		    font-size: 11px;
	    }
	    
	    label{
	    	width: 100px;
	    	font-weight: bold;
	    }

	</style>
</head>
<body>

	<div class="card card-body">
		<div  style="width:60%; height: 100%; font-size: 11px; margin: auto">
		<h3>REPORTES</h3>
		<hr>
			<div>
				<label>SEDE:</label><select id="listSedes" style="width: 500px;"></select><br><br>
				<div  style="width:100%; height: 100%; font-size: 12px; margin: auto; display: flex;">
					<div style="width: 20%;" align="left" id="divBusqueda">
						<label>ORGANOS:</label>
					</div>
					<div style="width: 50%;" align="left" id="divBusqueda">
						<select id="listOrganos" multiple style="width: 300px;" class="form form-control"></select>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
					</div>
					<div style="width: 25%;" align="left" id="divBusqueda">
						<button type="button" class="btn btn-info btn-sm" onclick="buscarBienes()"><i class="fas fa-search"></i>&nbsp;BUSCAR</button>
					</div>
				</div>
				<hr>
				<table id="tablaBienes" class="table">
					<thead class="thead-dark">
			            <tr>
			                <th>CODIGO</th>
			                <th>BIEN</th>
			                <th>CONSERVACION</th>
			                <th>OBSERVACIÓN</th>
			                <th>ANTIGUEDAD (AÑOS)</th>
			            </tr>
			        </thead>
			        <tbody>
			        </tbody>
				</table>
			</div>
		</div>
	</div>
	
	<script>
		$(document).ready(function() {
		  $('#listSedes').select2();
		});
	
		var sedes;
	   	$(document).ready(function() {
	   		$.ajax({
	       		type : "GET",
	       		url : "sede",
		        dataType : 'json',
		        success : function(data) {
		        	sedes = data;
		         	var html = '';
		         	var len = data.length;
		         	html+='<option value="0">SELECCIONE ...</option>';
		         	for (var i = 0; i < len; i++) {
						html+='<option value="' + data[i].id +'">'+data[i].denominacion+'</option>';
		         	}
			        $("#listSedes").html(html);
		        },
		        error : function(response){
		        	var r = jQuery.parseJSON(response.responseText);
					toastr.clear();
					toastr.options = {
						"closeButton":true,
						"progressBar": true,
						"positionClass":"toast-topcenter-right"
					};
					toastr.warning(r.message);	
		        }
	      	});
	   	});
	   	
	   	$('#listSedes').change(function() {
            var id = $(this).val();

            $.ajax({
	       		type : "GET",
	       		url : "organo/" + id,
		        dataType : 'json',
		        success : function(data) {
		        	sedes = data;
		         	var html = '';
		         	var len = data.length;
		         	for (var i = 0; i < len; i++) {
						html+='<option value="' + data[i].id +'"><input type="checkbox" id="' + data[i].id +'">'+data[i].denominacion+'</option>';
		         	}
			        $("#listOrganos").html(html);
		        },
		        error : function(response){
		        	var r = jQuery.parseJSON(response.responseText);
					toastr.clear();
					toastr.options = {
						"closeButton":true,
						"progressBar": true,
						"positionClass":"toast-topcenter-right"
					};
					toastr.warning(r.message);	
		        }
	      	});
        });
	   	
	   	function buscarBienes(){
	   		var lista = $('#listOrganos').val();
	   		$.ajax({
	       		type : "GET",
	       		url : "bien/reporte?idSede=" + $('#listSedes').val() + "&idsOrgano=" + lista,
		        dataType : 'json',
		        success : function(data) {

		        },
		        error : function(response){
		        	var r = jQuery.parseJSON(response.responseText);
					toastr.clear();
					toastr.options = {
						"closeButton":true,
						"progressBar": true,
						"positionClass":"toast-topcenter-right"
					};
					toastr.warning(r.message);	
		        }
	      	});
	   	}
	</script>
</body>
</html>
